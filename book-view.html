<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قراءة الكتاب — تسنيم</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .viewer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      background: var(--card-bg, #fff);
      border-bottom: 1px solid var(--line, #e2e8f0);
    }
    .viewer-frame {
      width: 100%;
      height: calc(100vh - 70px);
      border: none;
    }
    .loading-msg {
      text-align: center;
      padding: 3rem;
      font-size: 1.1rem;
      color: #666;
    }
  </style>
</head>
<body style="margin: 0; background: #f8fafc;">

  <div class="viewer-header">
    <h3 id="book-title" style="margin: 0; font-size: 1.1rem;">جاري التحميل...</h3>
    <div>
      <a id="download-btn" href="#" download class="btn" style="padding: 0.4rem 0.8rem; font-size: 0.85rem; margin-left: 0.5rem;">تحميل الـ PDF</a>
      <a href="index.html" class="btn" style="padding: 0.4rem 0.8rem; font-size: 0.85rem; background: #64748b;">إغلاق ✕</a>
    </div>
  </div>

  <div id="viewer-container">
    <div class="loading-msg">جاري تجهيز الكتاب للقراءة...</div>
  </div>

  <script src="scripts.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const bookId = params.get("id");
      const book = BOOKS.find(b => b.id === bookId) || BOOKS[0];

      if (book) {
        document.getElementById("book-title").textContent = book.title;
        document.getElementById("download-btn").href = book.pdfUrl || book.pdf;
        document.title = `${book.title} — تسنيم`;

        const pdfUrl = window.location.origin + '/' + (book.pdfUrl || book.pdf);
        const container = document.getElementById("viewer-container");

        // استخدام قارئ Google Docs السريع لمنع ثقل المتصفح وضمان الفتح على الهاتف والحاسوب
        container.innerHTML = `
          <iframe 
            class="viewer-frame" 
            src="https://docs.google.com/gview?url=${encodeURIComponent(pdfUrl)}&embedded=true"
            loading="lazy">
          </iframe>
        `;
      }
    });
  </script>
</body>
</html>
