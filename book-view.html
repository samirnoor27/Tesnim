<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قراءة الكتاب — تسنيم</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: var(--bg, #f8fafc);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .viewer-header {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      background: #ffffff !important; /* خلفية بيضاء ثابتة */
      color: #0f172a !important;      /* لون نص داكن واضح */
      border-bottom: 1px solid #e2e8f0;
      box-sizing: border-box;
    }

    .viewer-header h3 {
      margin: 0;
      font-size: 1rem;
      color: #0f172a !important; /* ضمان ظهور عنوان الكتاب باللون الداكن */
      font-weight: 700;
    }

    /* تصغير حجم خانة القارئ وتقليل استهلاك الذاكرة */
    .viewer-container {
      width: 95%;
      max-width: 850px;
      height: 70vh; /* تحديد ارتفاع 70% بدلاً من الشاشة الكاملة لتخفيف معالجة الصفحات */
      max-height: 650px;
      margin: 1rem auto;
      border: 1px solid var(--line, #cbd5e1);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      background: #ffffff;
    }

    embed, iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* تحسين إضافي للهواتف الذكية */
    @media (max-width: 768px) {
      .viewer-container {
        width: 100%;
        height: 60vh;
        margin: 0.5rem 0;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>

  <div class="viewer-header">
    <h3 id="book-title" style="margin: 0; font-size: 1rem;">جاري فتح الكتاب...</h3>
    <div>
      <a id="download-btn" href="#" download class="btn" style="padding: 0.35rem 0.75rem; font-size: 0.85rem; margin-left: 0.25rem;">تحميل الـ PDF</a>
      <a href="index.html" class="btn" style="padding: 0.35rem 0.75rem; font-size: 0.85rem; background: #64748b;">إغلاق ✕</a>
    </div>
  </div>

  <div class="viewer-container" id="viewer-container">
    <!-- محتوى قارئ الـ PDF المدمج المصغر -->
  </div>

  <script src="scripts.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const bookId = params.get("id");
      const book = BOOKS.find(b => b.id === bookId) || BOOKS[0];

      if (book) {
        document.getElementById("book-title").textContent = book.title;
        document.getElementById("download-btn").href = book.pdfUrl || book.pdf;
        document.title = `${book.title} — تسنيم`;

        const pdfPath = book.pdfUrl || book.pdf;
        const container = document.getElementById("viewer-container");

        container.innerHTML = `
          <embed src="${pdfPath}#toolbar=1&navpanes=0" type="application/pdf" />
        `;
      }
    });
  </script>
</body>
</html>
