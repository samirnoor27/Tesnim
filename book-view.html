<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قراءة الكتاب — تسنيم</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: var(--bg, #f8fafc);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .viewer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      background: var(--card-bg, #ffffff);
      border-bottom: 1px solid var(--line, #e2e8f0);
      z-index: 10;
    }
    .viewer-container {
      flex: 1;
      width: 100%;
      height: calc(100vh - 60px);
    }
    iframe, embed {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="viewer-header">
    <h3 id="book-title" style="margin: 0; font-size: 1.1rem;">جاري فتح الكتاب...</h3>
    <div>
      <a id="download-btn" href="#" download class="btn" style="padding: 0.4rem 0.8rem; font-size: 0.85rem; margin-left: 0.5rem;">تحميل الـ PDF</a>
      <a href="index.html" class="btn" style="padding: 0.4rem 0.8rem; font-size: 0.85rem; background: #64748b;">إغلاق ✕</a>
    </div>
  </div>

  <div class="viewer-container" id="viewer-container">
    <!-- سيتم عرض قارئ PDF مباشرة -->
  </div>

  <script src="scripts.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const bookId = params.get("id");
      const book = BOOKS.find(b => b.id === bookId) || BOOKS[0];

      if (book) {
        document.getElementById("book-title").textContent = book.title;
        document.getElementById("download-btn").href = book.pdfUrl || book.pdf;
        document.title = `${book.title} — تسنيم`;

        const pdfPath = book.pdfUrl || book.pdf;
        const container = document.getElementById("viewer-container");

        // استخدام القارئ المباشر للمتصفح الموثوق والسريع
        container.innerHTML = `
          <embed src="${pdfPath}#toolbar=1&navpanes=0" type="application/pdf" width="100%" height="100%" />
        `;
      }
    });
  </script>
</body>
</html>
