<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قراءة الكتاب — تسنيم</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .viewer-box {
      width: 100%;
      height: 88vh;
      margin-top: 1rem;
      border: 1px solid var(--line, #e2e8f0);
      border-radius: 12px;
      overflow: hidden;
      background: #f8fafc;
    }
    iframe, object {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <main class="container" style="padding: 1rem;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2 id="book-title" style="font-size: 1.25rem;">جاري تحميل الكتاب...</h2>
      <a href="index.html" class="btn" style="padding: 0.4rem 0.8rem; font-size: 0.9rem;">← العودة للمكتبة</a>
    </div>

    <div class="viewer-box" id="viewer-container">
      <!-- محتوى القارئ -->
    </div>
  </main>

  <script src="scripts.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const bookId = params.get("id");
      
      // البحث عن الكتاب المختار
      const book = BOOKS.find(b => b.id === bookId) || BOOKS[0];
      const container = document.getElementById("viewer-container");
      const titleEl = document.getElementById("book-title");

      if (book && container) {
        const pdfPath = book.pdfUrl || book.pdf;
        titleEl.textContent = book.title;
        document.title = `${book.title} — قراءة أونلاين`;

        container.innerHTML = `
          <object data="${pdfPath}" type="application/pdf">
            <iframe src="https://docs.google.com/viewer?url=${encodeURIComponent(window.location.origin + '/' + pdfPath)}&embedded=true">
              عفواً، لا يمكن عرض الملف مباشرة. يمكنك <a href="${pdfPath}" download>تحميل الكتاب من هنا</a>.
            </iframe>
          </object>
        `;
      }
    });
  </script>
</body>
</html>
