<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قراءة الكتاب — تسنيم</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: var(--bg, #f8fafc);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .viewer-header {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      background: #ffffff !important;
      color: #0f172a !important;
      border-bottom: 1px solid #cbd5e1;
      box-sizing: border-box;
    }

    .viewer-header h3 {
      margin: 0;
      font-size: 1rem;
      color: #0f172a !important;
      font-weight: 700;
    }

    .viewer-container {
      width: 95%;
      max-width: 850px;
      height: 72vh;
      max-height: 680px;
      margin: 1rem auto;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      background: #ffffff;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    @media (max-width: 768px) {
      .viewer-container {
        width: 100%;
        height: 65vh;
        margin: 0.5rem 0;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>

  <div class="viewer-header">
    <h3 id="book-title">جاري فتح الكتاب...</h3>
    <div>
      <a id="download-btn" href="#" download class="btn" style="padding: 0.35rem 0.75rem; font-size: 0.85rem; margin-left: 0.25rem;">تحميل الـ PDF</a>
      <a href="books.html" class="btn" style="padding: 0.35rem 0.75rem; font-size: 0.85rem; background: #64748b; color: #fff;">إغلاق ✕</a>
    </div>
  </div>

  <div class="viewer-container" id="viewer-container">
    <!-- قارئ Google Drive للمعاينة أونلاين -->
  </div>

  <script src="scripts.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const bookId = params.get("id");
      const book = BOOKS.find(b => b.id === bookId) || BOOKS[0];

      if (book) {
        document.getElementById("book-title").textContent = book.title;
        document.getElementById("download-btn").href = book.pdfUrl || book.pdf;
        document.title = `${book.title} — تسنيم`;

        const container = document.getElementById("viewer-container");
        
        // جلب رابط التضمين أو تحويل رابط Google Drive تلقائياً لمشرع المعاينة preview
        let embedUrl = book.driveEmbedUrl;
        if (!embedUrl && book.pdfUrl) {
          if (book.pdfUrl.includes('drive.google.com')) {
            const match = book.pdfUrl.match(/id=([a-zA-Z0-9_-]+)/) || book.pdfUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
              embedUrl = `https://drive.google.com/file/d/${match[1]}/preview`;
            }
          } else {
            embedUrl = book.pdfUrl;
          }
        }

        container.innerHTML = `
          <iframe src="${embedUrl}" allow="autoplay"></iframe>
        `;
      }
    });
  </script>
</body>
</html>
